name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Publishes through GitHub's API; skip on mirrors such as Gitea.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check VERSION matches tag
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: make all deb
      - name: Package binaries
        run: tar -czf "xpu-smi-tui_$(cat VERSION)_linux_amd64.tar.gz" xpu-smi-tui xpu-exporter LICENSE README.md
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $(cat VERSION)" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.deb
          body_path: notes.md
